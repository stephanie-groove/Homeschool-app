<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Path · Today</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2F4A35">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="One calm homeschool class a day: phonics, spelling, nature study and support for tired moms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Oswald:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE3; --card:#FAF8F4; --ink:#3B352E; --soft:#776E63; --edge:#DDD5C7;
  --sage:#6E7F5E; --sage-bg:#E2E6D8; --blue:#647A88; --blue-bg:#E1E7EA; --wood:#B89B74; --wood-bg:#EDE3D3;
  --marker:var(--sage); --marker-bg:var(--sage-bg); --pen:var(--blue); --pen-bg:var(--blue-bg);
  --green:var(--sage); --paper:var(--bg); --line:#E3DCCF; --sand:#E6D6B8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211F1B; --card:#2B2823; --ink:#ECE6DB; --soft:#ADA394; --edge:#3D3932;
    --sage:#A5B490; --sage-bg:#353B2E; --blue:#9BB0BD; --blue-bg:#2D363B; --wood:#CDB28C; --wood-bg:#3A3229;
    --line:#35312B; --sand:#4A402F;
  }
}
:root[data-theme="dark"]{
  --bg:#211F1B; --card:#2B2823; --ink:#ECE6DB; --soft:#ADA394; --edge:#3D3932;
  --sage:#A5B490; --sage-bg:#353B2E; --blue:#9BB0BD; --blue-bg:#2D363B; --wood:#CDB28C; --wood-bg:#3A3229;
  --line:#35312B; --sand:#4A402F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Andika","Trebuchet MS",system-ui,sans-serif; font-size:17px; line-height:1.5}
body.locked{overflow:hidden}
.wrap{max-width:640px; margin:0 auto; padding:18px 18px 64px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:8px}
h1{font-size:1.9rem; line-height:1.15; margin:10px 0 2px; font-weight:700}
.sub{color:var(--soft); margin:0 0 16px}
.box{background:var(--card); border:1px solid var(--edge); border-radius:20px; padding:18px; margin-bottom:16px}
.box h2{font-size:1.25rem; margin:0 0 6px; line-height:1.25}
.muted{color:var(--soft); font-size:.95rem}
.btn{border:0; border-radius:14px; padding:13px 18px; background:var(--sage); color:#fff; font-weight:700; font-size:1.05rem}
.btn.alt{background:transparent; color:var(--ink); border:1px solid var(--edge); font-weight:400}
.btn.wide{width:100%}
.btn:disabled{opacity:.4; cursor:default}
.tabs{display:flex; gap:8px; margin-bottom:16px}
.tab{flex:1; text-align:left; border:1px solid var(--edge); background:transparent; border-radius:16px; padding:10px 14px}
.tab b{display:block}
.tab span{font-size:.85rem; color:var(--soft)}
.tab[aria-selected="true"]{background:var(--card); border-color:var(--sage); box-shadow:inset 0 0 0 1px var(--sage)}

.agenda{list-style:none; padding:0; margin:14px 0}
.agenda li{display:flex; align-items:center; gap:12px; padding:7px 0}
.agenda li+li{border-top:1px solid var(--edge)}
.agenda .ico{width:34px; height:34px; border-radius:50%; background:var(--wood-bg); display:grid; place-items:center; flex:none}
.agenda .ico svg{width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.agenda .nm{flex:1}
.agenda .mn{color:var(--soft); font-size:.9rem}
.modes{display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:14px; margin:12px 0}
.modes button{flex:1; border:0; background:transparent; border-radius:11px; padding:8px 6px; font-size:.95rem}
.modes button[aria-pressed="true"]{background:var(--card); box-shadow:0 0 0 1px var(--edge); font-weight:700}
.weekdots{display:flex; gap:6px; margin:4px 0 0}
.weekdots span{flex:1; text-align:center; font-size:.8rem; color:var(--soft)}
.weekdots i{display:block; height:8px; border-radius:9px; background:var(--edge); margin-bottom:4px}
.weekdots i.on{background:var(--sage)}

.start ol{padding-left:1.3em; margin:8px 0 12px}
.start li{margin-bottom:6px}
.coachcard{display:flex; gap:14px; align-items:center}
.coachcard .av{width:48px; height:48px; border-radius:50%; background:var(--blue-bg); display:grid; place-items:center; flex:none}
.coachcard .av svg{width:26px; height:26px; stroke:var(--blue); fill:none; stroke-width:1.8; stroke-linecap:round}
.basket{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:40px}
.basket svg{width:32px; height:32px}
.dayrow{display:flex; gap:12px; align-items:center; padding:8px 0}
.dayrow+.dayrow{border-top:1px solid var(--edge)}
.dayrow input{appearance:none; flex:none; width:24px; height:24px; border:1.5px solid var(--soft); border-radius:7px; display:grid; place-content:center; background:var(--card); cursor:pointer}
.dayrow input:checked{background:var(--sage); border-color:var(--sage)}
.dayrow input:checked::after{content:""; width:11px; height:6px; border:2.5px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px)}
.dayrow label{flex:1; cursor:pointer}
.dayrow small{display:block; color:var(--soft)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.chips button{border:0; background:var(--blue-bg); color:var(--ink); border-radius:10px; padding:3px 10px; font-size:1.05rem}
.chips.h button{background:var(--wood-bg)}
.sounds{font-size:2.2rem; font-weight:700; letter-spacing:.06em; margin:2px 0}
textarea,input[type=text]{width:100%; font:inherit; font-size:.95rem; color:var(--ink); background:var(--bg); border:1px solid var(--edge); border-radius:12px; padding:9px 11px}
textarea{min-height:64px; resize:vertical}
details summary{cursor:pointer; padding:4px 0; font-weight:700}
.list{list-style:none; padding:0; margin:0}
.list button{width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:0; border-radius:10px; padding:6px 8px; min-height:42px}
.list button[aria-current="true"]{background:var(--sage-bg)}
.list .n{width:2.6em; color:var(--soft); font-size:.88rem; flex:none}
.list .t{flex:1}
.dots{display:flex; gap:3px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--edge)}
.dots i.on{background:var(--sage)}
h3{font-size:1rem; margin:18px 0 4px; color:var(--soft)}
.status{font-size:.85rem; color:var(--soft); margin-top:20px}
label.f{display:block; margin:10px 0 4px; font-size:.9rem; color:var(--soft)}

/* sheets */
.sheet{position:fixed; inset:0; z-index:10; background:rgba(30,26,20,.45); display:none; align-items:flex-end; justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card); width:100%; max-width:640px; height:100%; overflow:auto; padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column}
@media (min-width:700px){ .sheet{align-items:center} .panel{height:auto; max-height:94vh; border-radius:22px} }
.ptop{display:flex; align-items:center; gap:10px; padding-top:env(safe-area-inset-top,0px)}
.x{border:0; background:var(--bg); width:40px; height:40px; border-radius:50%; font-size:1.3rem; line-height:1; flex:none}
.segs{display:flex; gap:4px; flex:1}
.segs i{flex:1; height:6px; border-radius:9px; background:var(--edge)}
.segs i.on{background:var(--sage)}
.segname{color:var(--soft); font-size:.9rem; margin:12px 0 0}
.body{flex:1; padding:6px 0 14px}
.body h2{font-size:1.5rem; margin:2px 0 10px; line-height:1.2}
.foot{display:flex; gap:8px; position:sticky; bottom:0; background:var(--card); padding-top:10px}
.foot .btn{flex:2}
.foot .btn.alt{flex:1}
.pause{border:0; background:none; color:var(--soft); text-decoration:underline; text-underline-offset:3px; padding:8px 0; width:100%}
.lyrics{font-size:1.35rem; line-height:1.6; margin:10px 0}
.lyrics p{margin:0}
.prayer{font-size:1.4rem; line-height:1.6; margin:14px 0}
.ring{display:grid; place-items:center; margin:14px auto; width:190px; height:190px; position:relative}
.ring svg{position:absolute; inset:0; transform:rotate(-90deg)}
.ring b{font-size:2.4rem; font-variant-numeric:tabular-nums}
.tline{display:flex; gap:8px; justify-content:center}
.idea{background:var(--bg); border-radius:16px; padding:16px; font-size:1.2rem; margin:8px 0}
.kind{display:inline-block; background:var(--sage-bg); border-radius:99px; padding:2px 12px; font-size:.9rem}
.mat{padding-left:1.2em; margin:6px 0}
.calm{width:150px; height:150px; border-radius:50%; background:var(--sage-bg); margin:20px auto; display:grid; place-items:center; animation:breathe 8s ease-in-out infinite}
.calm span{font-size:1.1rem}
@keyframes breathe{0%,100%{transform:scale(.75)} 50%{transform:scale(1.05)}}
.stamps{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0}
.stamps button{background:var(--bg); border:1px solid var(--edge); border-radius:16px; padding:12px 4px; display:grid; place-items:center; gap:4px; font-size:.9rem}
.stamps svg{width:48px; height:48px}
.stamps button[aria-pressed="true"]{border-color:var(--sage); box-shadow:inset 0 0 0 2px var(--sage)}

/* coach chat */
.chat{flex:1; display:flex; flex-direction:column; gap:10px; padding:10px 0}
.msg{max-width:88%; padding:10px 14px; border-radius:16px; white-space:pre-wrap}
.msg.me{align-self:flex-end; background:var(--sage-bg); border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start; background:var(--bg); border-bottom-left-radius:4px}
.quick{display:flex; flex-wrap:wrap; gap:6px}
.quick button{border:1px solid var(--edge); background:var(--card); border-radius:99px; padding:6px 12px; font-size:.92rem}
.ask{display:flex; gap:8px; position:sticky; bottom:0; background:var(--card); padding-top:8px}
.ask textarea{min-height:46px; flex:1}
.disc{font-size:.8rem; color:var(--soft); margin:6px 0 0}

/* lesson demo stage */
.stage{position:relative; aspect-ratio:16/11; border-radius:18px; overflow:hidden; display:grid; place-items:center; text-align:center; padding:12px; background:var(--bg); border:1px solid var(--edge)}
.scene{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%}
.cap{min-height:3.2em; margin:10px 2px 6px; font-size:1.05rem}
.progress{display:flex; gap:4px; margin:8px 0 2px}
.progress i{flex:1; height:4px; border-radius:9px; background:var(--edge)}
.progress i.on{background:var(--sage)}
.controls{display:flex; gap:8px}
.controls button{border:1px solid var(--edge); background:var(--card); border-radius:12px; padding:9px 0; flex:1}
.controls .play{flex:2; background:var(--ink); color:var(--card); border-color:var(--ink); font-weight:700}
.steps{padding-left:1.4em; margin:6px 0 0}
.steps li{margin:0 0 8px}
.steps li.now{font-weight:700}
.mine{margin-top:12px}
.mine video{width:100%; border-radius:12px; background:#000; margin-bottom:8px}
.upl{display:inline-flex; border:1px solid var(--edge); border-radius:99px; padding:6px 14px; cursor:pointer; font-size:.92rem}
.upl input{position:absolute; opacity:0; width:1px; height:1px}
.big{font-size:clamp(4.5rem,20vw,8rem); line-height:1; color:var(--ink); font-weight:700}
.big svg{color:var(--blue)}
.snd{font-size:clamp(1.6rem,6vw,2.4rem); color:var(--blue)}
.tiles{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.tl{font-size:clamp(1.8rem,8vw,3rem); line-height:1.2; background:var(--card); border:1.5px solid var(--edge); border-radius:12px; padding:4px 12px; min-width:1.5em; color:var(--ink)}
.tl.silent{opacity:.45}
.word{font-size:clamp(2.2rem,10vw,3.6rem); color:var(--ink); display:inline-block; line-height:1.2}
.word em{font-style:normal; color:var(--sage); text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px}
.hand{color:var(--blue)}
.sweep{display:block; height:5px; border-radius:9px; background:var(--sage); width:100%; transform-origin:left; animation:sweep 1.4s ease-in-out both; animation-delay:var(--d,0s)}
.row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; align-items:center}
.coin{min-width:54px; height:54px; padding:0 8px; border-radius:99px; display:grid; place-items:center; font-size:1.3rem; font-weight:700; background:var(--sage-bg); color:var(--ink)}
.card{background:var(--card); border:1.5px solid var(--edge); border-radius:12px; padding:8px 14px; font-size:clamp(1.4rem,6vw,2.2rem)}
.card.red{border-color:var(--wood); background:var(--wood-bg)}
.chip{background:var(--blue-bg); border-radius:10px; padding:2px 10px; font-size:1.3rem}
.tray{background:var(--sand); border-radius:14px; padding:6px 30px; box-shadow:inset 0 3px 8px rgba(0,0,0,.12)}
.tray svg{width:150px; height:120px}
.trace text{fill:transparent; stroke:var(--ink); stroke-width:2.5; stroke-dasharray:900; stroke-dashoffset:900; animation:trace 2.4s ease-in-out both, fillin .6s both; animation-delay:var(--d,0s), calc(var(--d,0s) + 2.4s)}
.paper{background:var(--card); border-radius:10px; padding:8px 18px; width:min(92%,420px); text-align:left; background-image:repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 41px)}
.paper .ln{font-size:1.7rem; line-height:40px; min-height:40px; display:flex; gap:10px; align-items:center}
.ok{color:var(--sage); font-weight:700}
.no{color:var(--wood); font-weight:700}
.coverbox{position:relative; display:inline-block; padding:4px 14px}
.coverbox .lid{position:absolute; inset:0; background:var(--blue); border-radius:10px; animation:cover .6s both; animation-delay:var(--d,0s)}
.pile{border:1.5px dashed var(--wood); border-radius:12px; padding:10px 16px; font-size:1rem}
.pop{animation:pop .45s cubic-bezier(.3,1.4,.6,1) both; animation-delay:var(--d,0s)}
.fade{animation:fade .5s both; animation-delay:var(--d,0s)}
.hi{animation:pop .45s both, hi .5s both; animation-delay:var(--d,0s), var(--h,0s)}
.settle{animation:settle .9s cubic-bezier(.3,1.3,.6,1) both; animation-delay:var(--d,0s)}
.pulse{animation:pop .45s both, pulse 1.4s 3 ease-in-out; animation-delay:var(--d,0s), calc(var(--d,0s) + .5s)}
.flip{animation:flip .5s both; animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(.4); opacity:0} to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes hi{to{background:var(--sage-bg); border-color:var(--sage); transform:translateY(-6px)}}
@keyframes sweep{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:var(--ink)}}
@keyframes settle{from{transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:.2} to{transform:none; opacity:1}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes flip{from{transform:rotateY(90deg); opacity:0} to{transform:none; opacity:1}}
@keyframes cover{from{transform:translateX(-120%)} to{transform:none}}

.storyline{display:flex; gap:12px; align-items:center; margin:14px 0 4px; padding:10px 12px; background:var(--bg); border-radius:14px}
.storyline .ico{width:34px; height:34px; border-radius:50%; background:var(--wood-bg); display:grid; place-items:center; flex:none}
.storyline .ico svg{width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.storyline .btn{padding:8px 12px; font-size:.92rem}
.storybox{background:var(--bg); border-radius:18px; padding:18px 18px 8px; margin-top:10px}
.storybox img{width:100%; border-radius:12px; margin-bottom:10px}
.stitle{margin:0 0 6px; color:var(--ink); font-size:1.15rem}
.stext{font-size:1.45rem; line-height:1.75; margin:0 0 10px}
.sw{cursor:pointer; border-radius:6px}
.sw.key{text-decoration:underline; text-decoration-color:var(--sage); text-decoration-thickness:3px; text-underline-offset:6px; font-weight:700}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cd{background:var(--bg); border-radius:12px; padding:6px 2px; text-align:center; min-height:66px}
.cd.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cd small{display:block; color:var(--soft); font-size:.72rem}
.cd b{display:block; font-size:1rem}
.cd span{display:flex; gap:3px; justify-content:center; min-height:9px; margin-top:3px}
.cd i,.legend i{width:9px; height:9px; border-radius:50%; display:inline-block}
.k1{background:var(--sage)} .k2{background:var(--blue)}
.legend{display:flex; gap:16px; margin-top:10px; font-size:.9rem; color:var(--soft)}
.legend span{display:flex; align-items:center; gap:6px}
.kid.spelling .bar2 i, .kid.spelling .ub i{background:var(--blue)}
.bigstat{font-size:2.2rem; font-weight:700; margin:8px 0 6px; line-height:1}
.bigstat small{font-size:1rem; color:var(--soft); font-weight:400}
.bar2{height:10px; background:var(--bg); border-radius:99px; overflow:hidden}
.bar2 i{display:block; height:100%; background:var(--sage); border-radius:99px}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px}
.stats div{background:var(--bg); border-radius:12px; padding:8px 4px; text-align:center}
.stats b{display:block; font-size:1.3rem}
.stats span{font-size:.78rem; color:var(--soft)}
.units{list-style:none; padding:0; margin:0}
.units li{display:grid; grid-template-columns:1fr 70px 34px; gap:8px; align-items:center; padding:4px 0; font-size:.92rem}
.units li.cur span:first-child{font-weight:700}
.ub{height:6px; background:var(--bg); border-radius:9px; overflow:hidden}
.ub i{display:block; height:100%; background:var(--sage)}
.note{background:var(--bg); border-radius:12px; padding:8px 12px; margin:6px 0; font-size:.95rem}

.enc{margin:4px 0 2px; padding:10px 14px; background:var(--wood-bg); border-radius:14px; font-size:.95rem; line-height:1.45}
.modes button{font-size:.9rem}
.stage .phase{position:absolute; top:10px; left:10px; z-index:1; background:var(--card); border:1px solid var(--edge); border-radius:99px; padding:2px 10px; font-size:.82rem; font-weight:700}
.errlog{margin-top:14px; border-top:1px solid var(--edge); padding-top:8px}
.errtypes{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.errtypes button{text-align:left; border:1px solid var(--edge); background:var(--bg); border-radius:12px; padding:8px 10px; display:grid; gap:2px}
.errtypes button small{color:var(--soft); font-size:.8rem; line-height:1.3}
.errtypes button[aria-pressed="true"]{border-color:var(--sage); box-shadow:inset 0 0 0 1.5px var(--sage); background:var(--sage-bg)}
.faith{background:var(--sage-bg); border-color:transparent}

.mainnav{display:flex; gap:4px; overflow-x:auto; background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:4px; margin:0 0 16px; scrollbar-width:none}
.mainnav button{flex:1 0 auto; border:0; background:transparent; border-radius:12px; padding:9px 12px; font-size:.92rem; white-space:nowrap; min-height:40px}
.mainnav button[aria-pressed="true"]{background:var(--sage); color:#fff; font-weight:700}
.pchips{display:flex; flex-wrap:wrap; gap:6px}
.pchip{display:inline-flex; flex-direction:column; text-decoration:none; color:var(--ink); background:var(--blue-bg); border-radius:12px; padding:6px 12px; font-size:.95rem}
.pchip small{color:var(--soft); font-size:.78rem}
.bughero{background:var(--wood-bg); border-color:transparent}
.bigidea{font-size:1.15rem; font-weight:700; margin:0 0 10px; padding:10px 14px; background:var(--sage-bg); border-radius:14px}
.readaloud{font-size:1.1rem; line-height:1.7; margin:0 0 10px}
.agegrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; font-size:.95rem}
.agegrid div{background:var(--bg); border-radius:12px; padding:10px}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.filters button{border:1px solid var(--edge); background:var(--card); border-radius:99px; padding:6px 12px; font-size:.9rem}
.filters button small{color:var(--soft)}
.filters button[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:#fff}
.filters button[aria-pressed="true"] small{color:#fff}
.plist{display:grid; gap:8px}
.pcard{background:var(--bg); border-radius:14px; padding:10px 12px}
.pcard a{color:var(--ink); text-decoration:none}
.pcard a b{text-decoration:underline; text-decoration-color:var(--edge); text-underline-offset:3px}
.tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.tags span{font-size:.78rem; background:var(--card); border:1px solid var(--edge); border-radius:99px; padding:1px 8px; color:var(--soft)}
.tags span.use{background:var(--sage-bg); border-color:transparent; color:var(--ink)}
.lab{display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:8px}
.lab select{font:inherit; font-size:.9rem; border:1px solid var(--edge); border-radius:12px; background:var(--card); color:var(--ink); padding:6px}
.lab .btn{padding:8px 12px}
.book{display:flex; gap:14px}
.spine{width:8px; border-radius:8px; flex:none; background:var(--sage)}
.spine.you{background:var(--wood)}
a.btn{display:inline-block; text-decoration:none}
.calmhero{background:var(--blue-bg); border-color:transparent}
.calm.big2{width:190px; height:190px; animation:none; transition:transform 4s ease-in-out; transform:scale(.7); text-align:center; padding:12px}
.calm.big2.grow{transform:scale(1.05)}
.feel{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.feel button{border:1px solid var(--edge); background:var(--bg); border-radius:14px; padding:12px 4px; font-size:.95rem}
.feel button[aria-pressed="true"]{background:var(--sage-bg); border-color:var(--sage); font-weight:700}
.pchip{border:0; text-align:left; cursor:pointer}
.momhero{background:var(--wood-bg); border-color:transparent}
.affirm{font-size:1.5rem; line-height:1.4; font-weight:700; margin:10px 0 6px}
.imggrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; margin-top:10px}
.imgtile{display:grid; place-items:center; text-align:center; min-height:64px; border-radius:12px; background:var(--bg); border:1px solid var(--edge); color:var(--ink); text-decoration:none; font-size:.85rem; padding:6px}

@media (prefers-reduced-motion:reduce){ .calm{animation:none} }
/* ===== Reading Path theme (matches the app mockup) ===== */
:root{
  --bg:#FBFAEC; --card:#FFFEF8; --ink:#2B3A2E; --soft:#5A6758; --edge:#E3E5D2; --arc:#DCE3C8;
  --forest:#2F4A35; --on-forest:#F4F2DF;
  --sage:#2F4A35; --sage-bg:#E4ECD8; --blue:#5F95A3; --blue-bg:#DDECEF; --wood:#B8902F; --wood-bg:#F8EDCB;
  --peach:#C9805F; --peach-bg:#F7E2D5; --butter-bg:#F8EDCB; --sky-bg:#DDECEF; --leaf-bg:#E4ECD8;
  --line:#E7E6D3; --sand:#EBDDBE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2320; --card:#252B26; --ink:#ECEBDD; --soft:#B6BFAF; --edge:#37413A; --arc:#2A332B;
    --forest:#9CC08A; --on-forest:#17201A; --sage:#9CC08A; --sage-bg:#2C3628; --blue:#8DBAC6; --blue-bg:#24353A;
    --wood:#D9B860; --wood-bg:#383121; --peach-bg:#3A2D25; --butter-bg:#383121; --sky-bg:#24353A; --leaf-bg:#2C3628;
    --line:#323A33; --sand:#4A402F;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2320; --card:#252B26; --ink:#ECEBDD; --soft:#B6BFAF; --edge:#37413A; --arc:#2A332B;
  --forest:#9CC08A; --on-forest:#17201A; --sage:#9CC08A; --sage-bg:#2C3628; --blue:#8DBAC6; --blue-bg:#24353A;
  --wood:#D9B860; --wood-bg:#383121; --peach-bg:#3A2D25; --butter-bg:#383121; --sky-bg:#24353A; --leaf-bg:#2C3628;
  --line:#323A33; --sand:#4A402F;
}
body{background:var(--bg)}
.wrap{max-width:560px; padding:22px 18px 120px}
h1,.box h2,.body h2,.pagehead h1,.crumb h1,.unitcard h2,.cardhead h2,#authGate h1{font-family:"Oswald","Arial Narrow",sans-serif; text-transform:uppercase; letter-spacing:.02em; font-weight:500; line-height:1.05}
h1{font-size:2.1rem}
.box{border:1.5px solid var(--edge); border-radius:24px; padding:16px 18px; margin-bottom:14px}
.box h2{font-size:1.3rem; margin:0 0 8px}
.body h2{font-size:2.1rem; margin:4px 0 10px}
.muted{color:var(--soft)}
.btn{border-radius:28px; padding:15px 20px; background:var(--forest); color:var(--on-forest); font-size:1.05rem}
.btn.alt{background:var(--card); border:1.5px solid var(--edge); color:var(--ink); font-weight:700}
.btn.sm{padding:8px 16px; font-size:.95rem}
.btn:disabled{opacity:.45}
:focus-visible{outline-color:var(--blue)}
textarea,input[type=text],input[type=email]{background:var(--bg); border:1.5px solid var(--edge); border-radius:16px}
.enc{background:var(--butter-bg); border-radius:18px}
.linkbtn{color:var(--soft)}
.status{text-align:center}

/* colored icon circles */
.ico{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--leaf-bg)}
.ico svg{width:16px; height:16px; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ico.lg{width:52px; height:52px} .ico.lg svg{width:22px; height:22px}
.ico.peach{background:var(--peach-bg)} .ico.butter{background:var(--butter-bg)} .ico.sage{background:var(--leaf-bg)} .ico.sky{background:var(--sky-bg)}
.agenda{margin:10px 0 2px}
.agenda li{padding:5px 0}
.agenda li+li{border-top:0}
.agenda .ico{width:32px; height:32px; background:var(--leaf-bg)}
.agenda .ico.peach{background:var(--peach-bg)} .agenda .ico.butter{background:var(--butter-bg)} .agenda .ico.sky{background:var(--sky-bg)}
.agenda .ico svg{width:16px; height:16px}
.storyline .ico{background:var(--butter-bg)}

/* today */
.hello{display:flex; align-items:center; gap:12px; margin:0 0 16px}
.hello .av{width:46px; height:46px; border-radius:50%; background:var(--peach-bg); display:grid; place-items:center; font-size:1.25rem; font-weight:700; flex:none}
.hello .who{flex:1; min-width:0}
.hello .who b{display:block; font-size:1.15rem}
.hello .linkbtn{padding:0; font-size:.85rem}
.iconbtn{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--edge); background:var(--card); display:grid; place-items:center; flex:none}
.iconbtn svg,.crumb .x svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.unitcard{background:var(--forest); color:var(--on-forest); border-radius:24px; padding:16px 18px; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; font-size:.9rem}
.unitcard h2{margin:0; font-size:1.55rem; color:var(--on-forest)}
.ubar{height:10px; border-radius:5px; background:rgba(255,255,255,.18); overflow:hidden}
.ubar i{display:block; height:100%; border-radius:5px; background:#F0D58C}
.hub{display:flex; justify-content:space-between; gap:4px; margin:0 0 16px; overflow-x:auto; scrollbar-width:none}
.hub button{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:.8rem; min-width:62px; padding:2px}
.hub .ico{width:52px; height:52px} .hub .ico svg{width:22px; height:22px}
.cardhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 4px 6px}
.cardhead h2{margin:0; font-size:1.3rem}
.cardhead .muted{font-size:.85rem}
.classcard .cardhead{margin:0 0 6px}
.modes{background:var(--bg); border-radius:22px; padding:3px; margin:10px 0}
.modes button{border-radius:19px; padding:8px 6px}
.modes button[aria-pressed="true"]{background:var(--leaf-bg); box-shadow:none}
#startClass.wide{margin:0 0 18px}
.tint-sky{background:var(--sky-bg); border-color:transparent}
.tint-butter{background:var(--butter-bg); border-color:transparent}

/* week plan */
.pagehead{position:relative; margin:-22px -18px 14px; padding:26px 18px 18px; overflow:hidden}
.pagehead.arc::before{content:""; position:absolute; left:-35%; right:-35%; top:-330px; height:520px; border-radius:50%; background:var(--arc); z-index:-1}
.pagehead{isolation:isolate}
.pagehead h1{font-size:2.2rem; margin:4px 0 12px}
.kicker{margin:0; color:var(--soft); font-size:.9rem}
.kids{display:flex; gap:6px; flex-wrap:wrap}
.kids button{border-radius:99px; padding:7px 16px; border:1.5px solid var(--edge); background:var(--card); font-size:.95rem}
.kids button[aria-selected="true"]{background:var(--forest); border-color:var(--forest); color:var(--on-forest)}
.days{display:grid; gap:10px}
.daycard{display:flex; align-items:center; gap:12px; background:var(--card); border:1.5px solid var(--edge); border-radius:22px; padding:12px 14px}
.daycard.now{border:2px solid var(--forest)}
.dtxt{flex:1; min-width:0}
.dtxt small{display:block; font-size:.78rem; color:var(--soft)}
.dtxt b{display:block; font-size:1.05rem}
.dtxt span{font-size:.85rem; color:var(--soft)}
.tick{width:36px; height:36px; border-radius:50%; border:1.5px solid var(--edge); background:var(--bg); display:grid; place-items:center; flex:none; padding:0}
.tick.on{background:var(--forest); border-color:var(--forest)}
.tick svg{width:16px; height:16px; stroke:var(--on-forest); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.chips button{border-radius:99px; padding:4px 12px}

/* sub-page header */
.crumb{display:flex; align-items:center; gap:12px; margin:0 0 16px}
.crumb .x{width:44px; height:44px; border:1.5px solid var(--edge); background:var(--card); display:grid; place-items:center}
.crumb h1{margin:0; font-size:1.9rem}

/* floating bottom tab bar */
.bnav{position:fixed; z-index:5; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); width:min(342px, calc(100% - 48px)); height:64px; border-radius:32px; background:var(--forest); display:flex; justify-content:space-around; align-items:center; padding:0 8px; box-shadow:0 10px 30px rgba(28,46,32,.22)}
.bnav button{width:48px; height:48px; border-radius:50%; border:0; background:transparent; display:grid; place-items:center; padding:0}
.bnav svg{width:22px; height:22px; fill:none; stroke:var(--on-forest); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.bnav button[aria-pressed="true"]{background:#F8EDCB}
.bnav button[aria-pressed="true"] svg{stroke:#2F4A35}
body.locked .bnav{display:none}

/* class sheet, coach and other sheets */
.panel{background:var(--bg)}
@media (min-width:700px){ .panel{border-radius:28px} }
.x{width:44px; height:44px; border:1.5px solid var(--edge); background:var(--card); font-size:1.4rem}
.segs i{height:6px; border-radius:3px}
.segs i.on{background:var(--forest)}
.segname{font-size:.9rem}
.foot{background:var(--bg)}
.ask{background:var(--bg)}
.stage{border-radius:28px; background:var(--leaf-bg); border:0}
.controls button{border:1.5px solid var(--edge); border-radius:25px; min-height:50px}
.controls .play{background:var(--forest); border-color:var(--forest); color:var(--on-forest)}
.progress i.on{background:var(--forest)}
.tl,.card{border-radius:18px}
.calm{background:var(--sky-bg)}
.stamps button{border-radius:20px; background:var(--card)}
.msg.me{background:var(--leaf-bg)} .msg.ai{background:var(--card); border:1.5px solid var(--edge)}
.quick button{border-width:1.5px}
.faith{background:var(--forest); color:var(--on-forest)} .faith .muted{color:var(--on-forest); opacity:.85}
.bar2 i,.ub i,.dots i.on,.weekdots i.on,.k1{background:var(--forest)}
.mainnav{display:none}

/* sign-in welcome screen */
#authGate{background:var(--bg)!important; overflow:auto}
#authGate .welcome{position:relative; max-width:420px; width:100%; margin:auto; text-align:center; padding:10px 6px 24px}
#authGate .welcome::before{content:""; position:fixed; left:-30%; right:-30%; top:-300px; height:640px; border-radius:50%; background:var(--arc); z-index:-1}
#authGate .tag{font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.12em; font-size:.85rem; color:var(--soft)}
#authGate h1{font-size:3.4rem; margin:6px 0 10px}
.wm span:nth-child(4n+1){color:#C9805F} .wm span:nth-child(4n+2){color:#B8902F} .wm span:nth-child(4n+3){color:#6F9460} .wm span:nth-child(4n){color:#5F95A3}
.ltiles{position:relative; height:200px; margin:6px auto 12px; width:280px}
.ltiles span{position:absolute; width:58px; height:58px; border-radius:16px; display:grid; place-items:center; font-size:2rem; font-weight:700; color:#2B3A2E; box-shadow:0 6px 0 rgba(47,74,53,.08)}
.pills{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0 16px}
.pills span{border-radius:99px; padding:6px 14px; font-size:.9rem}

/* ===== landing look and motion, across the app ===== */
.skyhead,.lsky{position:relative; overflow:hidden; isolation:isolate; color:#fff; background:linear-gradient(180deg,#7FB3D0 0%,#A9CDE0 38%,#D9E8E3 62%,#E9EED2 100%)}
.skyhead{margin:-22px -18px 18px; padding:calc(16px + env(safe-area-inset-top,0px)) 18px 150px; min-height:270px; border-radius:0 0 32px 32px}
.skyhead.tall{padding-bottom:190px}
.scn{position:absolute; inset:0; z-index:-1; pointer-events:none}
.scn .scene{width:100%; height:100%; display:block}
.skc{position:relative}
.skyhead h1{color:#fff; font-weight:600; font-size:clamp(2.5rem,11vw,3.6rem); line-height:.98; margin:6px 0 14px; text-shadow:0 2px 4px rgba(28,70,120,.25),0 4px 26px rgba(28,70,120,.45)}
.skyhead .kicker{color:#fff; font-family:"Oswald","Arial Narrow",sans-serif; text-transform:uppercase; letter-spacing:.14em; font-size:.85rem; margin:0; text-shadow:0 1px 8px rgba(28,70,120,.45)}
.skyhead > .skc > .x{margin-bottom:14px}
.glass{background:rgba(47,74,53,.42)!important; border:1.5px solid rgba(255,255,255,.7)!important; color:#fff!important; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.glass svg{stroke:#fff!important}
.skyhead .hello{margin:0 0 18px}
.skyhead .hello .av{color:#fff}
.skyhead .hello .linkbtn{flex:1; text-align:left; color:#fff; font-weight:700; font-size:.9rem; text-shadow:0 1px 6px rgba(28,70,120,.5)}
.skyhead .unitcard{background:rgba(255,254,248,.78); color:#2B3A2E; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1.5px solid rgba(255,255,255,.8); margin:0; max-width:420px}
.skyhead .unitcard h2{color:#2B3A2E}
.skyhead .unitcard .ubar{background:rgba(47,74,53,.14)}
.skyhead .unitcard .ubar i{background:#2F4A35}
.skyhead .kids button{background:rgba(47,74,53,.42); border-color:rgba(255,255,255,.7); color:#fff; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.skyhead .kids button[aria-selected="true"]{background:#2F4A35; border-color:#2F4A35; color:#fff}

/* lesson and sheet banners */
.lsky{margin:-14px -18px 10px; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 96px; flex:none}
.lsky.short{padding-bottom:70px}
@media (min-width:700px){ .lsky{border-radius:28px 28px 0 0} }
.lsky .ptop{padding-top:0}
.lsky .segs i{background:rgba(255,255,255,.45)}
.lsky .segs i.on{background:#2F4A35}
.lsky .segname,.lsky .ptop h2{color:#fff; text-shadow:0 1px 8px rgba(28,70,120,.5)}
.lsky .segname{font-family:"Oswald","Arial Narrow",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:.85rem}
.lsky .ptop h2{font-family:"Oswald","Arial Narrow",sans-serif; text-transform:uppercase; letter-spacing:.02em; font-weight:500; font-size:1.6rem!important}

/* the bottom bar stays forest green in both modes */
.bnav{background:#2F4A35}
.bnav svg{stroke:#F4F2DF}

/* scene motion (same as the landing page) */
.cloud{animation:drift linear infinite}
.c1{animation-duration:90s} .c2{animation-duration:130s; animation-delay:-40s} .c3{animation-duration:110s; animation-delay:-80s}
@keyframes drift{from{transform:translateX(-30%)} to{transform:translateX(130%)}}
.sway{transform-box:fill-box; transform-origin:50% 100%; animation:sway 4.5s ease-in-out infinite}
.sway.b{animation-duration:5.5s; animation-delay:-1.2s} .sway.c{animation-duration:3.8s; animation-delay:-2.4s}
@keyframes sway{0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)}}
.leafs{transform-box:fill-box; transform-origin:50% 90%; animation:rustle 6s ease-in-out infinite}
@keyframes rustle{0%,100%{transform:rotate(-.6deg)} 50%{transform:rotate(.8deg)}}

/* content rises in */
.rv{opacity:0; transform:translateY(26px); transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i,0) * 80ms)}
.rv.in{opacity:1; transform:none}
.rise > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.rise > *:nth-child(2){animation-delay:.07s} .rise > *:nth-child(3){animation-delay:.14s} .rise > *:nth-child(4){animation-delay:.21s} .rise > *:nth-child(n+5){animation-delay:.28s}
@keyframes rise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}

/* the butterfly */
#bfly{position:fixed; z-index:60; left:0; top:0; width:64px; height:64px; pointer-events:none; will-change:transform}
#bfly svg{width:100%; height:100%}
#bfly .w{transform-box:fill-box; animation:flap .32s ease-in-out infinite alternate}
#bfly .wl{transform-origin:100% 50%} #bfly .wr{transform-origin:0% 50%}
@keyframes flap{from{transform:scaleX(1)} to{transform:scaleX(.25)}}

@media (prefers-reduced-motion:reduce){
  .cloud,.sway,.leafs,#bfly .w,.rise > *{animation:none}
  .rv{opacity:1; transform:none; transition:none}
  #bfly{display:none}
}

/* sign-in: the landing page's hillside */
#authGate{background:linear-gradient(180deg,#7FB3D0 0%,#A9CDE0 38%,#D9E8E3 62%,#E9EED2 100%)!important; isolation:isolate}
#authGate .gatescene{position:fixed}
#authGate .welcome::before{display:none}
#authGate .tag{color:#fff; text-shadow:0 1px 8px rgba(28,70,120,.45)}
#authGate h1{text-shadow:0 2px 14px rgba(255,255,255,.55)}
#authGate .lede{color:#22352A; font-size:1.05rem; margin:0; text-shadow:0 0 10px rgba(255,255,255,.85),0 0 2px rgba(255,255,255,.9)}
#authGate .gatecard{text-align:left; background:#FFFEF8; color:#2B3A2E; border-radius:24px; padding:16px; box-shadow:0 12px 40px rgba(28,70,120,.18); margin-bottom:220px}
#authGate .gatecard .f,#authGate .gatecard .muted{color:#55624F}
#authGate .gatecard input{background:#FBFAEC!important; color:#2B3A2E!important}
#authGate .gatecard .btn{background:#2F4A35; color:#fff}

/* ===== For Mom: reminder cards (text on a painted scene, with gentle motion) ===== */
.rcard{position:relative; display:flex; flex-direction:column; justify-content:flex-start; aspect-ratio:4/5; border-radius:24px; overflow:hidden; isolation:isolate; cursor:pointer; text-align:center; padding:18% 10% 0; box-shadow:0 6px 18px rgba(43,58,46,.12); transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s}
.rcard:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(43,58,46,.18)}
.rcard .rscene{position:absolute; inset:0; width:100%; height:100%; z-index:-1}
.rtext{font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:500; font-size:clamp(.95rem,3.8vw,1.15rem); line-height:1.35; color:#22352A; text-shadow:0 0 12px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.8)}
.rtag{position:absolute; left:50%; bottom:7%; transform:translateX(-50%); white-space:nowrap; font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; color:#fff; background:rgba(34,53,42,.38); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border-radius:99px; padding:3px 10px}
.ink-light .rtext{color:#FBF5E2; text-shadow:0 1px 10px rgba(10,16,30,.6)}
.rgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
@media (min-width:520px){ .rgrid{grid-template-columns:repeat(3,1fr)} }
.rgrid .rtext{font-size:clamp(.82rem,3.4vw,.98rem)}
.rhero{margin-bottom:16px}
.rhero .rcard{aspect-ratio:4/4.4; padding:16% 9% 0; border-radius:28px; box-shadow:0 14px 34px rgba(43,58,46,.2)}
.rhero .rtext{font-size:clamp(1.35rem,6.4vw,1.9rem)}
.rhero .rtag{font-size:.75rem}
.rctl{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 4px}
.rctl #affNext{flex:1}
.scenepick{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.scenepick button{display:flex; flex-direction:column; align-items:center; gap:4px; border:1.5px solid var(--edge); background:var(--card); border-radius:16px; padding:8px 4px; font-size:.82rem}
.scenepick .sw{width:100%; height:36px; border-radius:10px}
.scenepick button[aria-checked="true"]{border-color:var(--forest); box-shadow:inset 0 0 0 1.5px var(--forest)}

/* full-screen reminder */
.rview{position:fixed; inset:0; z-index:55; background:rgba(20,28,22,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); touch-action:pan-y; animation:fadein .35s ease both}
.rv-stage{width:min(460px,100%); animation:cardin .55s cubic-bezier(.2,.8,.2,1) both}
.rv-stage.from-r{animation-name:fromr} .rv-stage.from-l{animation-name:froml}
.rcard.big{aspect-ratio:4/5.2; max-height:72vh; margin:0 auto; padding:18% 9% 0; border-radius:30px; cursor:default}
.rcard.big .rtext{font-size:clamp(1.5rem,7vw,2.2rem)}
.rcard.big .rtag{font-size:.8rem}
.rv-close{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px}
.rv-bar{display:flex; gap:12px}
.rv-b{width:54px; height:54px; border-radius:50%; border:1.5px solid rgba(255,255,255,.6); background:rgba(255,255,255,.14); display:grid; place-items:center}
.rv-b svg{width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.rv-b[aria-pressed="true"]{background:#F3BFCB; border-color:#F3BFCB} .rv-b[aria-pressed="true"] svg{stroke:#5A2B36; fill:#5A2B36}
.rv-count{margin:0; color:rgba(255,255,255,.75); font-size:.85rem}
@keyframes fadein{from{opacity:0}}
@keyframes cardin{from{opacity:0; transform:translateY(24px) scale(.96)}}
@keyframes fromr{from{opacity:0; transform:translateX(60px) rotate(2deg)}}
@keyframes froml{from{opacity:0; transform:translateX(-60px) rotate(-2deg)}}

/* scene motion: only on cards that are on screen */
.rcard *{animation-play-state:paused}
.rcard.live *{animation-play-state:running}
.r-cloud{animation:rcloud 14s ease-in-out infinite alternate}
.r-cloud.b{animation-duration:19s; animation-delay:-6s}
@keyframes rcloud{from{translate:-18px 0} to{translate:22px 0}}
.r-tree{transform-box:fill-box; transform-origin:50% 100%; animation:rustle 6s ease-in-out infinite}
.rtext{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0} 50%{translate:0 -4px}}
.p-star{animation:twinkle calc(3s * var(--s)) ease-in-out infinite; animation-delay:var(--d)}
@keyframes twinkle{0%,100%{opacity:.25} 50%{opacity:1}}
.p-rain{animation:rain calc(1.1s * var(--s)) linear infinite; animation-delay:var(--d)}
@keyframes rain{from{translate:0 0; opacity:0} 15%{opacity:1} to{translate:-30px 120px; opacity:0}}
.p-fly{animation:fly calc(6s * var(--s)) ease-in-out infinite; animation-delay:var(--d)}
@keyframes fly{0%,100%{translate:0 0; opacity:.2} 30%{opacity:1} 50%{translate:14px -22px; opacity:.9} 80%{translate:-10px -8px; opacity:.35}}
.p-mote{animation:mote calc(9s * var(--s)) ease-in-out infinite; animation-delay:var(--d)}
@keyframes mote{from{translate:0 0; opacity:0} 30%{opacity:.9} to{translate:20px -120px; opacity:0}}
.p-seed{animation:seed calc(11s * var(--s)) linear infinite; animation-delay:var(--d)}
@keyframes seed{from{translate:0 0; opacity:0} 15%{opacity:1} to{translate:120px -260px; rotate:25deg; opacity:0}}
.p-petal{animation:petal calc(9s * var(--s)) linear infinite; animation-delay:var(--d)}
@keyframes petal{from{translate:0 -20px; rotate:0deg; opacity:0} 10%{opacity:1} to{translate:-70px 420px; rotate:300deg; opacity:.2}}
@media (prefers-reduced-motion:reduce){ .rcard *, .rview, .rv-stage{animation:none!important} .rcard:hover{transform:none} }

/* real photos for words */
.picgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:100%; max-width:420px}
.picc{display:flex; flex-direction:column; border:0; padding:0; background:var(--card); border-radius:20px; overflow:hidden; box-shadow:0 0 0 2px #fff, 0 6px 16px rgba(43,58,46,.14); cursor:pointer}
.picc img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block}
.picc b{font-size:clamp(1.4rem,6vw,1.9rem); padding:4px 0 8px; color:var(--ink)}
.wordpic{width:min(220px,60%); aspect-ratio:4/3; object-fit:cover; border-radius:18px; box-shadow:0 0 0 3px #fff, 0 8px 20px rgba(43,58,46,.16)}
.stage.has-pics{aspect-ratio:auto; min-height:260px; padding:16px 12px}
.chips button{display:inline-flex; align-items:center; gap:6px}
.chips button img{width:28px; height:28px; border-radius:50%; object-fit:cover; margin-left:-6px}
.ltiles{width:290px!important}

/* ===== Letters: meadow path, letter card, garden, journal, settings ===== */
:root{ --cons:#E9A5B1; --cons-bg:#FBE9EC; --vow:#8DB7DD; --vow-bg:#E6F0F8; --mead1:#BFD8B8; --mead2:#8DB78A; --mead3:#5E8F62; }
.fr{font-family:"Fraunces",Georgia,serif!important; text-transform:none!important; letter-spacing:0!important; font-weight:500!important}
.kicker2{margin:0; font-size:.8rem; color:var(--soft); letter-spacing:.04em}
.lchips{display:flex; gap:8px; margin:0 0 14px; flex-wrap:wrap}
.lchips button{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--edge); background:var(--card); border-radius:99px; padding:8px 14px; min-height:44px; font-size:.95rem}
.lchips svg{width:18px; height:18px; fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ltoday{display:flex; align-items:center; gap:14px}
.ltoday .lt-txt{flex:1; min-width:0}
.ltoday h2.fr{font-size:2rem!important; margin:0 0 2px; line-height:1}
.lt-snd{font-family:Andika,sans-serif; font-size:1rem}
.lt-pic{width:84px; height:84px; flex:none; border-radius:22px; display:grid; place-items:center; overflow:hidden}
.lt-pic.cons,.lcard.cons,.pcardx.cons{background:var(--cons-bg); box-shadow:inset 0 0 0 2px var(--cons)}
.lt-pic.vowel,.lcard.vowel,.pcardx.vowel{background:var(--vow-bg); box-shadow:inset 0 0 0 2px var(--vow)}
.lt-plain{font-family:Andika,sans-serif; font-size:2.6rem; font-weight:700}
.meadow{position:relative; margin:4px -18px 10px; background:linear-gradient(180deg,var(--mead1),#CFE3C6 30%,var(--mead1) 70%,#B2D0A9); border-radius:32px; overflow:hidden}
.mpath{position:absolute; inset:0; width:100%; height:100%}
.steplab{position:absolute; font-family:"Fraunces",Georgia,serif; font-style:italic; color:#3F6B4A; font-size:.95rem}
.stone{position:absolute; width:60px; height:60px; border-radius:50% 48% 52% 46%; border:0; background:#F6F1E4; box-shadow:0 4px 0 rgba(63,107,74,.25), inset 0 0 0 2.5px var(--cons); display:grid; place-items:center; font-family:Andika,sans-serif; font-weight:700; font-size:1.6rem; color:#2F3B33; padding:0}
.stone.vowel{box-shadow:0 4px 0 rgba(63,107,74,.25), inset 0 0 0 2.5px var(--vow)}
.stone.done{background:#EAF3E3}
.stone .sprout{position:absolute; width:30px; height:30px; top:-20px; left:15px; fill:none; stroke:#3F6B4A; stroke-width:1.6}
.stone.now::after{content:""; position:absolute; inset:-9px; border-radius:50%; border:3px solid rgba(255,255,255,.9); animation:ring 2.6s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.94); opacity:.5} 50%{transform:scale(1.06); opacity:1}}

/* letter sheet */
.lsheet{position:fixed; inset:0; z-index:54; background:var(--bg); display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px)); overflow:auto; animation:fadein .3s ease both}
.lsheet > *{width:100%; max-width:480px; margin-left:auto; margin-right:auto}
.ls-top{display:flex; align-items:center; gap:10px}
.ls-top .kicker2{flex:1}
.lbtn{display:inline-flex; align-items:center; gap:6px; border:0; background:var(--forest); color:var(--on-forest); border-radius:99px; padding:10px 16px; min-height:44px; font-weight:700}
.lbtn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ls-body{flex:1; padding:14px 0}
.flip{perspective:1200px}
.lcard{position:relative; border-radius:30px; min-height:400px; transition:transform .7s cubic-bezier(.3,.7,.2,1); transform-style:preserve-3d}
.flip.flipped .lcard{transform:rotateY(180deg)}
.lc-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:18px}
.lc-face.front{position:relative; min-height:400px}
.lc-face.back{transform:rotateY(180deg); text-align:center}
.al{font-family:Andika,sans-serif; font-weight:700}
.lc-sound{margin:0; font-family:Andika,sans-serif; font-size:3rem; font-weight:700; color:#2F3B33; animation:rise .6s both}
.lc-word{display:flex; flex-direction:column; align-items:center; gap:6px; animation:rise .6s both}
.lc-word img{width:150px; aspect-ratio:4/3; object-fit:cover; border-radius:16px; box-shadow:0 0 0 3px #fff}
.lc-word b{font-family:Andika,sans-serif; font-size:2rem; color:#2F3B33}
.lc-trick{font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:1.5rem; line-height:1.35; color:#2F3B33; max-width:320px}
.ls-actions,.ls-foot{display:flex; gap:8px; margin-top:8px}
.ls-actions .btn,.ls-foot .btn{flex:1}
.ls-foot .btn[aria-pressed="true"]{background:var(--leaf-bg); border-color:var(--mead3)}
.find-q{font-size:1.6rem; text-align:center; margin:6px 0 14px}
.findgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.fpic{display:flex; flex-direction:column; border:0; padding:0; background:var(--card); border-radius:18px; overflow:hidden; box-shadow:0 0 0 2px var(--edge)}
.fpic img{width:100%; aspect-ratio:1; object-fit:cover}
.fpic .fword{display:grid; place-items:center; aspect-ratio:1; font-size:1.2rem; background:var(--leaf-bg)}
.fpic b{padding:6px 0 8px; font-family:Andika,sans-serif; font-size:1.15rem}
.fpic.yes{box-shadow:0 0 0 4px var(--mead3); animation:pop .4s both}
.fpic.no{animation:shake .45s both}
@keyframes shake{20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}
.find-msg{text-align:center; margin-top:12px}

/* garden */
.gintro{margin:0 4px 12px}
.garden{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:linear-gradient(180deg,#E6F0E0,#D7E8CF); border-radius:28px; padding:14px 10px}
@media (min-width:480px){ .garden{grid-template-columns:repeat(6,1fr)} }
.plot{border:0; background:none; display:flex; flex-direction:column; align-items:center; padding:2px; min-height:44px}
.plot svg{width:100%; max-width:64px; height:auto}
.plot span{font-family:Andika,sans-serif; font-weight:700; font-size:1.05rem; color:#2F3B33; border-bottom:2.5px solid var(--cons)}
.plot span.vowel{border-color:var(--vow)}
.plot.resting span{opacity:.55}
.plot .bloom{transform-box:fill-box; transform-origin:50% 100%; animation:sway 5s ease-in-out infinite}
.plot:nth-child(3n) .bloom{animation-duration:6.2s} .plot:nth-child(4n+1) .bloom{animation-delay:-2s}

/* journal */
.jkid{margin:8px 0 12px}
.jsteps{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px}
.jsteps div{position:relative; height:28px; background:var(--bg); border-radius:10px; overflow:hidden}
.jsteps i{position:absolute; inset:0 auto 0 0; background:var(--mead1)}
.jsteps span{position:relative; display:block; text-align:center; font-size:.72rem; line-height:28px}
.jlist{padding-left:1.3em; margin:0} .jlist li{margin-bottom:8px}
.jphoto{margin:4px 0 10px} .jphoto img{width:100%; max-height:280px; object-fit:cover; border-radius:18px}

/* settings */
.kidrow{border-top:1px solid var(--edge); padding-top:6px; margin-top:8px}
.kidrow:first-of-type{border-top:0}
select{width:100%; font:inherit; font-size:.95rem; color:var(--ink); background:var(--bg); border:1.5px solid var(--edge); border-radius:16px; padding:10px 12px}
.vgrid{display:grid; gap:6px}
.vrow{display:flex; align-items:center; gap:8px}
.vl{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-family:Andika,sans-serif; font-weight:700; font-size:1.2rem; background:var(--cons-bg)}
.vl.vowel{background:var(--vow-bg)}
.vs{width:44px}
.vrow .btn.sm{padding:8px 12px; min-height:40px}

/* printable letter cards */
#printCards-sheet{display:none}
@media print{
  body.print-letters > *{display:none!important}
  body.print-letters #printCards-sheet{display:grid!important; grid-template-columns:repeat(3,1fr); gap:10mm}
  .pcardx{break-inside:avoid; border-radius:6mm; padding:6mm; display:flex; flex-direction:column; align-items:center; gap:2mm; font-family:Andika,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .pcardx b{font-size:20pt} .pcardx span{font-size:14pt}
}
@media (prefers-reduced-motion:reduce){ .stone.now::after,.plot .bloom,.lcard,.lsheet{animation:none!important; transition:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sheet" id="classSheet" role="dialog" aria-modal="true" aria-label="Today's class">
  <div class="panel">
    <div class="lsky"><div class="scn"></div>
    <div class="ptop"><div class="segs" id="segs"></div><button class="x glass" id="cclose" aria-label="Close class">×</button></div>
    <p class="segname" id="segname"></p></div>
    <div class="body" id="cbody"></div>
    <div class="foot" id="cfoot"></div>
  </div>
</div>

    <div class="lsky short"><div class="scn"></div>
    <div class="ptop"><h2 style="flex:1;margin:0;font-size:1.2rem">Parent coach</h2><button class="x glass" id="kclose" aria-label="Close coach">×</button></div></div>
    <p class="disc">Gentle guidance on tears, focus and tired days. Not medical advice: for health or development worries, talk with your pediatrician.</p>

    <div class="quick" id="quick"></div>
    <div class="ask" id="ask"></div>
  </div>
</div>

<div class="sheet" id="storySheet" role="dialog" aria-modal="true" aria-label="This week's story">
  <div class="panel">
    <div class="lsky short"><div class="scn"></div>
    <div class="ptop"><h2 style="flex:1;margin:0;font-size:1.2rem">This week's story</h2><button class="x glass" id="sclose" aria-label="Close">×</button></div></div>
    <div class="body" id="sbody"></div>
  </div>
</div>

<div class="sheet" id="placeSheet" role="dialog" aria-modal="true" aria-label="Starting check">
  <div class="panel">
    <div class="lsky short"><div class="scn"></div>
    <div class="ptop"><h2 style="flex:1;margin:0;font-size:1.2rem">Starting check</h2><button class="x glass" id="plclose" aria-label="Close">×</button></div></div>
    <div class="body" id="pbody"></div>
  </div>
</div>
